<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musselli — Tendencias</title>
<meta name="description" content="Novedades reales en herramientas, materiales y accesorios para guitarra, revisadas por un luthier.">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --negro:#141212; --borgona:#5D0002; --hueso:#F5F0E6; --crema:#F3ECE1; --dorado:#CCA353; --cobre:#C89B6C; }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Poppins',sans-serif; background:var(--hueso); color:#2a2723; }
  header { background:var(--negro); padding:18px 40px; }

  .intro { padding:48px 40px 24px; max-width:1000px; margin:0 auto; }
  .intro h1 { font-family:'Lora',serif; font-size:26px; color:var(--negro); margin-bottom:8px; }
  .intro p { color:#6b6355; font-size:14px; }

  .grid-wrap { max-width:1000px; margin:0 auto; padding:0 40px 48px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:20px; }
  .card { background:#fff; border-left:4px solid var(--dorado); padding:22px; text-decoration:none; color:inherit; display:block; }
  .card .cat { font-size:10px; color:var(--borgona); text-transform:uppercase; letter-spacing:0.8px; font-weight:600; }
  .card h3 { font-family:'Lora',serif; font-size:16px; margin:8px 0; line-height:1.4; color:var(--negro); }
  .card .price { color:var(--borgona); font-weight:600; font-size:14px; margin-bottom:8px; }
  .card .excerpt { font-size:13px; color:#6b6355; line-height:1.6; margin-bottom:10px; }
  .card .date { font-size:11px; color:#a89d87; }

  #empty { color:#8a857c; padding:40px; text-align:center; }
  footer { background:var(--negro); padding:24px; text-align:center; color:#6b6355; font-size:12px; }
</style>
</head>
<body>

<header><img src="assets-site/logo-tendencias.png" alt="Musselli Tendencias" style="height:28px;"></header>

<div class="intro">
  <h1>Tendencias</h1>
  <p>Herramientas, materiales y accesorios en tendencia, con precio y fuente verificada — no promocionamos guitarras completas de terceros.</p>
</div>

<div class="grid-wrap">
  <div class="grid" id="grid"></div>
  <div id="empty" style="display:none;">Todavía no hay publicaciones.</div>
</div>

<footer>© Musselli — Guitar Tech · Luthier</footer>

<script>
const SUPABASE_URL = "https://zquxompfcahmjquobnvk.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpxdXhvbXBmY2FobWpxdW9ibnZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMDk2NjAsImV4cCI6MjEwMzY4NTY2MH0.ZMa0_ZFsEKVK0lRydq1zjxQDcteGXxOKdmr00D-62wk";

function catLabel(cat) { return cat === "guitar-tech" ? "Guitar Tech" : "Luthier"; }
function fmtDate(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleDateString("es-AR", { day: "numeric", month: "long", year: "numeric" });
}

async function loadPosts() {
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/list-published?product=trend`, {
      headers: { Authorization: `Bearer ${ANON_KEY}` },
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    const posts = data.posts || [];
    if (posts.length === 0) {
      document.getElementById("empty").style.display = "block";
      return;
    }

    const grid = document.getElementById("grid");
    grid.innerHTML = posts.map((p) => `
      <a class="card" href="./${p.slug}/">
        <div class="cat">${catLabel(p.category)}</div>
        <h3>${p.title}</h3>
        ${p.price_usd ? `<div class="price">USD $${p.price_usd}</div>` : ""}
        <div class="excerpt">${p.excerpt}</div>
        <div class="date">${fmtDate(p.published_at)}</div>
      </a>
    `).join("");
  } catch (err) {
    document.getElementById("empty").style.display = "block";
    document.getElementById("empty").textContent = "Error cargando publicaciones.";
    console.error(err);
  }
}

loadPosts();
</script>
</body>
</html>
